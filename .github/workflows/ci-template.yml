# Starter CI: test gate only. Owner C completes it (L4): build -> push to GHCR with the sha tag.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit + Testcontainers tests + JaCoCo gate
        run: mvn -B verify
