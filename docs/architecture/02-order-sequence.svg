<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1130" viewBox="0 0 1140 1130" font-family="Segoe UI, Arial, sans-serif">
  <title>Place order — sequence: happy path and payment-failure compensation</title>
  <desc>Synchronous stock check and pricing, one transaction for the order and its outbox row, then the choreographed Saga over Kafka: inventory reserves, payment charges, order confirms and notification informs the customer. The failure path shows a declined payment: inventory releases the stock, order cancels and the customer is notified.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker>
  </defs>
  <rect width="1140" height="1130" fill="#FFFFFF"/>
  <text x="30" y="26" font-size="16" font-weight="600" fill="#2C2C2A">Place order — sequence (happy path + payment-failure compensation)</text>
  <rect x="8" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="70" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">Client</text>
  <text x="70" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">browser / Postman</text>
  <line x1="70" y1="80" x2="70" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="138" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="200" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">api-gateway</text>
  <text x="200" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:8080</text>
  <line x1="200" y1="80" x2="200" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="278" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="340" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">order-service</text>
  <text x="340" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:8082</text>
  <line x1="340" y1="80" x2="340" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="418" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="480" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">product-service</text>
  <text x="480" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:8081</text>
  <line x1="480" y1="80" x2="480" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="558" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="620" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">inventory-service</text>
  <text x="620" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:8084</text>
  <line x1="620" y1="80" x2="620" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="708" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="770" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">Kafka</text>
  <text x="770" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:9092</text>
  <line x1="770" y1="80" x2="770" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="848" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="910" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">payment-service</text>
  <text x="910" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:8083</text>
  <line x1="910" y1="80" x2="910" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="998" y="40" width="124" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="1060" y="57" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">notification</text>
  <text x="1060" y="73" font-size="11" fill="#5F5E5A" text-anchor="middle">:8085</text>
  <line x1="1060" y1="80" x2="1060" y2="1000" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="14" y="92" width="1112" height="600" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-dasharray="6 5" fill-opacity="0.35"/>
  <text x="26" y="110" font-size="13" font-weight="600" fill="#085041">Happy path — FR-05, FR-06, FR-07, FR-08, FR-09, FR-11</text>
  <line x1="70" y1="140" x2="197" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135.0" y="134" font-size="12" fill="#2C2C2A" text-anchor="middle">POST /api/v1/orders + Bearer JWT</text>
  <line x1="200" y1="172" x2="337" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270.0" y="166" font-size="12" fill="#2C2C2A" text-anchor="middle">JWT valid · role CUSTOMER</text>
  <text x="270.0" y="186" font-size="11" fill="#5F5E5A" text-anchor="middle">X-User-Id = sub</text>
  <line x1="340" y1="212" x2="617" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480.0" y="206" font-size="12" fill="#2C2C2A" text-anchor="middle">GET /inventory/check?productId&amp;quantity</text>
  <text x="480.0" y="226" font-size="11" fill="#5F5E5A" text-anchor="middle">Feign · CircuitBreaker · Retry · Bulkhead · TimeLimiter</text>
  <line x1="620" y1="252" x2="343" y2="252" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="480.0" y="246" font-size="12" fill="#2C2C2A" text-anchor="middle">200 {available: true}</text>
  <line x1="340" y1="284" x2="477" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410.0" y="278" font-size="12" fill="#2C2C2A" text-anchor="middle">GET /products/{id}  (price, 60 s cache)</text>
  <rect x="348" y="302" width="538.4" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="358" y="317" font-size="11.5" fill="#085041">ONE DB transaction: orders = PENDING  +  outbox_event OrderPlaced (+ traceparent)</text>
  <line x1="340" y1="352" x2="73" y2="352" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="205.0" y="346" font-size="12" fill="#2C2C2A" text-anchor="middle">201 {orderId, status: PENDING}</text>
  <text x="205.0" y="366" font-size="11" fill="#5F5E5A" text-anchor="middle">client polls GET /orders/{id}</text>
  <line x1="340" y1="388" x2="767" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555.0" y="382" font-size="12" fill="#2C2C2A" text-anchor="middle">outbox poller → OrderPlaced</text>
  <text x="555.0" y="402" font-size="11" fill="#5F5E5A" text-anchor="middle">topic order-events · key orderId</text>
  <line x1="770" y1="426" x2="623" y2="426" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="695.0" y="420" font-size="12" fill="#2C2C2A" text-anchor="middle">OrderPlaced</text>
  <rect x="628" y="438" width="470" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="638" y="453" font-size="11.5" fill="#085041">TX: reserve stock (atomic UPDATE) + reservation + outbox InventoryReserved</text>
  <line x1="620" y1="488" x2="767" y2="488" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="695.0" y="482" font-size="12" fill="#2C2C2A" text-anchor="middle">InventoryReserved → inventory-events</text>
  <line x1="770" y1="520" x2="907" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840.0" y="514" font-size="12" fill="#2C2C2A" text-anchor="middle">InventoryReserved</text>
  <rect x="562" y="532" width="340" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="572" y="547" font-size="11.5" fill="#085041">TX: charge once (UNIQUE order_id, key = orderId) + outbox</text>
  <line x1="910" y1="582" x2="773" y2="582" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840.0" y="576" font-size="12" fill="#2C2C2A" text-anchor="middle">PaymentCompleted → payment-events</text>
  <line x1="770" y1="614" x2="343" y2="614" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555.0" y="608" font-size="12" fill="#2C2C2A" text-anchor="middle">PaymentCompleted → PENDING → CONFIRMED + outbox OrderConfirmed</text>
  <line x1="770" y1="644" x2="623" y2="644" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="695.0" y="638" font-size="12" fill="#2C2C2A" text-anchor="middle">PaymentCompleted → reservation CONSUMED</text>
  <line x1="770" y1="676" x2="1057" y2="676" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="915.0" y="670" font-size="12" fill="#2C2C2A" text-anchor="middle">OrderConfirmed → confirmation sent</text>
  <rect x="14" y="706" width="1112" height="296" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-dasharray="6 5" fill-opacity="0.35"/>
  <text x="26" y="724" font-size="13" font-weight="600" fill="#791F1F">Failure path — payment declined → compensation (FR-09, NFR-05)</text>
  <rect x="348" y="730" width="520" height="22" rx="4" fill="#FFF6E0" stroke="#B5852A"/>
  <text x="358" y="745" font-size="11.5" fill="#6B4E12">Same start as above: 201 PENDING, OrderPlaced, stock reserved, InventoryReserved …</text>
  <line x1="770" y1="782" x2="907" y2="782" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840.0" y="776" font-size="12" fill="#2C2C2A" text-anchor="middle">InventoryReserved</text>
  <rect x="792" y="794" width="110" height="22" rx="4" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="802" y="809" font-size="11.5" fill="#791F1F">charge declined</text>
  <line x1="910" y1="842" x2="773" y2="842" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="840.0" y="836" font-size="12" fill="#791F1F" text-anchor="middle">PaymentFailed → payment-events</text>
  <line x1="770" y1="876" x2="623" y2="876" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="695.0" y="870" font-size="12" fill="#791F1F" text-anchor="middle">PaymentFailed → release reservation, stock back to available</text>
  <line x1="770" y1="910" x2="343" y2="910" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="555.0" y="904" font-size="12" fill="#791F1F" text-anchor="middle">PaymentFailed → PENDING → CANCELLED + outbox OrderCancelled</text>
  <line x1="340" y1="944" x2="767" y2="944" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="555.0" y="938" font-size="12" fill="#791F1F" text-anchor="middle">OrderCancelled → order-events</text>
  <line x1="770" y1="976" x2="1057" y2="976" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="915.0" y="970" font-size="12" fill="#791F1F" text-anchor="middle">OrderCancelled → cancellation notice</text>
  <rect x="14" y="1018" width="1112" height="100" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="26" y="1038" font-size="13" font-weight="600" fill="#2C2C2A">Other failure paths (ADD §6)</text>
  <text x="26" y="1060" font-size="11.5" fill="#444441">No stock → 409 OUT_OF_STOCK before any row is written; payment is never touched (F5).   Inventory down → retry, then circuit-breaker fallback 503 STOCK_CHECK_UNAVAILABLE (F4).</text>
  <text x="26" y="1077" font-size="11.5" fill="#444441">Stock taken between check and reservation → InventoryReservationFailed → order CANCELLED (F7).   Payment down → events wait in Kafka, order stays PENDING, completes later (F1, NFR-01).</text>
  <text x="26" y="1094" font-size="11.5" fill="#444441">Saga stuck &gt; 10 min → order sweeper cancels and publishes OrderCancelled; inventory releases (F10).   Missed cancel → inventory sweeper releases after 30 s (F11, NFR-05).</text>
  <text x="26" y="1111" font-size="11.5" fill="#444441">A consumer keeps failing → 3 retries, then &lt;topic&gt;.DLT + ALERT log (NFR-10).   Duplicate delivery → processed_event dedup, nothing changes twice (F3).</text>
</svg>
