<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700" font-family="Segoe UI, Arial, sans-serif">
  <title>Where data lives — table to database, per service</title>
  <desc>Database per service on one PostgreSQL instance. Each service owns one database and its Flyway migrations; no service reads another service's tables. order_db also holds the Bonus B2 read model (Member C, V50+). Redis holds the product cache and the gateway rate-limit buckets; Kafka carries the events between services. notification-service has no database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/></marker>
  </defs>
  <rect width="1140" height="700" fill="#FFFFFF"/>
  <text x="30" y="28" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start">Where data lives — one database per service (Flyway owns every schema, ddl-auto=validate)</text>
  <rect x="30" y="40" width="12" height="12" rx="2" fill="#185FA5"/>
  <text x="48" y="50" font-size="11" fill="#5F5E5A" text-anchor="start">owner A</text>
  <rect x="120" y="40" width="12" height="12" rx="2" fill="#3B6D11"/>
  <text x="138" y="50" font-size="11" fill="#5F5E5A" text-anchor="start">owner B</text>
  <rect x="210" y="40" width="12" height="12" rx="2" fill="#854F0B"/>
  <text x="228" y="50" font-size="11" fill="#5F5E5A" text-anchor="start">owner C</text>
  <text x="310" y="50" font-size="11" fill="#5F5E5A" text-anchor="start">No service reads another service's database: data crosses boundaries only through REST (sync) or Kafka events (async).</text>
  <rect x="26" y="200" width="1094" height="304" rx="8" fill="#F7F6F2" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="40" y="494" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">PostgreSQL 16 — one instance (compose service postgres, Kubernetes StatefulSet postgres); one database per service</text>
