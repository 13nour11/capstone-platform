spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      enabled: false
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:inventory_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests authenticate with jwt() post-processors
          jwk-set-uri: http://localhost:1/certs
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

inventory:
  outbox:
    poll-interval-ms: 600000
  sweeper:
    fixed-delay-ms: 600000
