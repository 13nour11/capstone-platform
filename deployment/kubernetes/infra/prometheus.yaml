apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  # Same scrape targets as deployment/docker/prometheus/prometheus.yml: Helm releases use the service names.
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: spring-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - config-server:8888
              - eureka-server:8761
              - api-gateway:8080
              - product-service:8081
              - order-service:8082
              - payment-service:8083
              - inventory-service:8084
              - notification-service:8085
              - review-service:8086
          - review-service:8086
        relabel_configs:
          - source_labels: [__address__]
            regex: '([^:]+):\d+'
            target_label: service
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
