global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888", "eureka-server:8761"]

  # Application services run on the host during development (mvn spring-boot:run / IDE)
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # product-service
          - host.docker.internal:8082   # order-service
          - host.docker.internal:8083   # payment-service
          - host.docker.internal:8084   # inventory-service
          - host.docker.internal:8085   # notification-service
