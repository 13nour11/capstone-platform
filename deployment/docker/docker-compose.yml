# Local platform (NFR-08). Secrets come from the repo-root .env (copy .env.example); nothing secret lives here.
# Usage, from the repo root:
#   docker compose --env-file .env -f deployment/docker/docker-compose.yml up -d --build
name: capstone

x-spring-env: &spring-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # Tokens are issued to browsers and k6 on localhost; keys are fetched inside the network.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/certs

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 512m

x-platform-deps: &platform-deps
  eureka-server: { condition: service_healthy }
  config-server: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?set in .env}
    # Host port is configurable: a locally installed PostgreSQL often owns 5432 already
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      KAFKA_HEAP_OPTS: -Xmx256m
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2181"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx512m
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HTTP_PORT: 8180
      # Fixed issuer: tokens carry iss=http://localhost:8180/... whether fetched from the host or from a container
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholders resolved inside realm-export.json at import time
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?set in .env}
      KC_TEST_USER_PASSWORD: ${KC_TEST_USER_PASSWORD:?set in .env}
    ports: ["8180:8180"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    environment:
      # In-memory storage keeps 500k spans by default, more than the image's 160 MB heap holds: with 100 % sampling
      # Zipkin ran out of memory and restarted under load (Performance Report §5). Keep the most recent spans only.
      MEM_MAX_SPANS: "20000"
    ports: ["9411:9411"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # k6 streams its metrics here (Load tests section of the README)
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  # ---------------------------------------------------------------- platform
  eureka-server:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/eureka-server/Dockerfile
    ports: ["8761:8761"]

  config-server:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/config-server/Dockerfile
    depends_on:
      eureka-server: { condition: service_healthy }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      # Serve the repository's config-repo, mounted below, so config edits need no rebuild
      CONFIG_REPO_URI: file:/config-repo/
    ports: ["8888:8888"]
    volumes:
      - ../../config-repo:/config-repo:ro

  api-gateway:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/api-gateway/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
    depends_on:
      <<: *platform-deps
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["${GATEWAY_HOST_PORT:-8080}:8080"]

  # ---------------------------------------------------------------- business services
  product-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/product-service/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD:?set in .env}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      <<: *platform-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8081:8081"]

  order-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      # FR-14: client-credentials token for the stock check
      ORDER_SERVICE_AUTH_ENABLED: "true"
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?set in .env}
      KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/token
    depends_on:
      <<: *platform-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["8082:8082"]

  payment-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      PAYMENT_SIMULATION_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
    depends_on:
      <<: *platform-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8083:8083"]

  inventory-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
    depends_on:
      <<: *platform-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8084:8084"]

  notification-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *spring-env
      NOTIFICATION_SIMULATE_FAILURE: ${NOTIFICATION_SIMULATE_FAILURE:-false}
    depends_on:
      <<: *platform-deps
      kafka: { condition: service_healthy }
    ports: ["8085:8085"]

  # Bonus B1
  review-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/review-service/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_db
      SPRING_DATASOURCE_USERNAME: review_user
      SPRING_DATASOURCE_PASSWORD: ${REVIEW_DB_PASSWORD:?set in .env}
    depends_on:
      <<: *platform-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8086:8086"]

volumes:
  postgres-data:
