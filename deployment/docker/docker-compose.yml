# Local platform (NFR-08): `docker compose up -d --build` from deployment/docker.
# Secrets come from deployment/docker/.env (copy .env.example). Nothing secret lives in this file.
name: capstone-platform

x-spring-env: &spring-env
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  # The ${...} placeholders used in application.yml and config-repo/ (their defaults point at localhost)
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  # Tokens are issued to browsers and k6 on localhost; keys are fetched inside the network.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/certs
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/certs

x-db-env: &db-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/docker/.env}

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 384m

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/docker/.env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    mem_limit: 256m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      KAFKA_HEAP_OPTS: -Xmx128m -Xms128m
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    mem_limit: 768m
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in deployment/docker/.env}
      # Placeholders in realm-export.json, resolved at import so no secret lives in Git.
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?Set ORDER_SERVICE_CLIENT_SECRET in deployment/docker/.env}
      KC_TEST_USER_PASSWORD: ${KC_TEST_USER_PASSWORD:?Set KC_TEST_USER_PASSWORD in deployment/docker/.env}
      # One issuer for every caller, so tokens fetched on localhost validate inside the network.
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xmx512m
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deployment/docker/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- platform
  config-server:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/config-server/Dockerfile
    environment:
      # Serve the repository's config-repo, mounted below (Brief §7: "reads /config-repo").
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ../../config-repo:/config-repo:ro
    ports:
      - "8888:8888"

  eureka-server:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/eureka-server/Dockerfile
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8761:8761"

  api-gateway:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/api-gateway/Dockerfile
    environment:
      <<: *spring-env
      SPRING_DATA_REDIS_HOST: redis
      # Defaults match FR-13 (20/s, burst 40). A k6 run drives far more than that from one source
      # address, so raise these for the run or the test measures the limiter, not the platform.
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"

  # ---------------------------------------------------------------- business services
  product-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/product-service/Dockerfile
    environment:
      <<: [*spring-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      POSTGRES_HOST: postgres
      PRODUCT_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/docker/.env}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  order-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: [*spring-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PRODUCT_SERVICE_URL: http://product-service:8081
      PRODUCT_PRICE_CACHE_TTL_SECONDS: ${PRODUCT_PRICE_CACHE_TTL_SECONDS:-60}
      # FR-14: the stock check carries order-service's own client-credentials token
      ORDER_SERVICE_AUTH_ENABLED: "true"
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?Set ORDER_SERVICE_CLIENT_SECRET in deployment/docker/.env}
      KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/token
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"

  payment-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: [*spring-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_SIMULATION_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"

  inventory-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    environment:
      <<: [*spring-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      # FR-14: /check only for the SERVICE role (order-service's client-credentials token)
      INVENTORY_REQUIRE_SERVICE_TOKEN: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"

  notification-service:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *spring-env
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"

volumes:
  postgres-data:
