# Infrastructure (PostgreSQL, Kafka, Redis, Keycloak, Zipkin, Prometheus, Grafana) as raw manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/13nour11/capstone-platform.git
    # CI commits image-tag bumps to env/dev; main stays protected (ADD §7)
    targetRevision: env/dev
    path: deployment/kubernetes/infra
  destination:
    server: https://kubernetes.default.svc
    # Must match the namespace the manifests themselves declare. They all set `ecommerce`, and the
    # only Namespace object created is `ecommerce`; a destination of `infra` made every sync fail
    # with "Resource namespace does not match application destination" and left the DNS names in
    # the Helm values (postgres.infra, kafka.infra, ...) pointing at a namespace that never existed.
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
