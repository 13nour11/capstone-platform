# Defaults for every service. deployment/helm/values/<service>.yaml overrides them.
# The release name is the service name (ArgoCD uses the application name), e.g. product-service.

image:
  repository: ""          # required, e.g. ghcr.io/13nour11/capstone-platform/product-service
  tag: latest             # CI replaces it with the git sha
  pullPolicy: IfNotPresent

imagePullSecrets: []      # e.g. [{name: ghcr-pull}] for private GHCR packages

replicaCount: 1

containerPort: 8080

service:
  type: ClusterIP
  port: 8080
  nodePort: null          # only with type NodePort (api-gateway)

# Plain (non-secret) environment variables
env: {}

# Existing Kubernetes Secret whose keys become environment variables (passwords, client secrets).
# Created outside Git by scripts/create-k8s-secrets.sh (NFR-04). Empty = no secret.
secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
  # Slow JVM start on a laptop cluster: allow up to 10 minutes before liveness takes over.
  # With 9 JVMs starting at once on 4 cores, 3 minutes was not enough (killed by the startup probe).
  startupFailureThreshold: 120
  # Kubernetes' default probe timeout is 1 s. On a CPU-saturated laptop an answer takes longer, the
  # liveness probe fails and the pod is restarted in a loop. 5 s matches the compose HEALTHCHECK.
  timeoutSeconds: 5
