image:
  repository: ghcr.io/13nour11/payment-service
  tag: latest

containerPort: 8083
service:
  port: 8083

# Names must match the ${...} placeholders in config-repo/payment-service.yml and application.yml.
# payment-service spells the issuer settings in full (SPRING_SECURITY_...), unlike the services that
# read KEYCLOAK_ISSUER_URI.
env:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.ecommerce:5432/payment_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.ecommerce:9092
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.ecommerce:9411/api/v2/spans
  # Must equal the iss claim, i.e. Keycloak KC_HOSTNAME in the cluster (infra manifest)
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak.ecommerce:8180/realms/ecommerce-platform/protocol/openid-connect/certs

# Supplies SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (scripts/create-k8s-secrets.sh)
secretName: db-credentials
