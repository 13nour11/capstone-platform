image:
  repository: ghcr.io/13nour11/capstone-platform/order-service
  tag: latest   # CI commits the git sha here on the env/dev branch

containerPort: 8082
service:
  port: 8082

env:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  # Must equal the iss claim: Keycloak's KC_HOSTNAME (kind maps host 8180 to the Keycloak NodePort)
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/certs
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
  SPRING_DATASOURCE_USERNAME: order_user
  # FR-14: client-credentials token for the stock check (secret ORDER_SERVICE_CLIENT_SECRET in order-service-secrets)
  KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/token

# Keys (SPRING_DATASOURCE_PASSWORD, ...): see scripts/create-k8s-secrets.sh
secretName: order-service-secrets
