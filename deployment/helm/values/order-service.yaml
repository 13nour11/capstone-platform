image:
  repository: ghcr.io/13nour11/order-service
  tag: latest

containerPort: 8082
service:
  port: 8082

# Names must match the ${...} placeholders in config-repo/order-service.yml and application.yml.
# Anything not supplied here falls back to its localhost default, which works in Compose and fails
# in a cluster.
env:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.ecommerce:5432/order_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.ecommerce:9092
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.ecommerce:9411/api/v2/spans
  INVENTORY_SERVICE_URL: http://inventory-service:8084
  PRODUCT_SERVICE_URL: http://product-service:8081
  # Must equal the iss claim, i.e. Keycloak KC_HOSTNAME in the cluster (infra manifest)
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  KEYCLOAK_JWK_SET_URI: http://keycloak.ecommerce:8180/realms/ecommerce-platform/protocol/openid-connect/certs
  # FR-14: the stock check carries order-service's own client-credentials token
  ORDER_SERVICE_AUTH_ENABLED: "true"
  KEYCLOAK_TOKEN_URI: http://keycloak.ecommerce:8180/realms/ecommerce-platform/protocol/openid-connect/token

# Supplies SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (scripts/create-k8s-secrets.sh)
secretName: db-credentials
# Supplies ORDER_SERVICE_CLIENT_SECRET (FR-14)
extraSecretNames:
  - order-service-client
