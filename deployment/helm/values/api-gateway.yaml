image:
  repository: ghcr.io/13nour11/api-gateway
  tag: latest

containerPort: 8080
service:
  port: 8080

env:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  REDIS_HOST: redis.ecommerce
  # Must equal the iss claim, i.e. Keycloak KC_HOSTNAME in the cluster (infra manifest)
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  KEYCLOAK_JWK_SET_URI: http://keycloak.ecommerce:8180/realms/ecommerce-platform/protocol/openid-connect/certs
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.ecommerce:9092
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.ecommerce:9411/api/v2/spans
