# --- tracing/logging (B) ---
management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  observations:
    enable:
      # The outbox pollers run every 500 ms and would otherwise bury the request traces in Zipkin.
      spring.scheduled: false

logging:
  # NFR-06: JSON logs, one object per line. Micrometer Tracing puts traceId/spanId in the MDC and the
  # logstash format writes them as fields, so searching one traceId finds every line of one order in
  # every service. Example:
  # {"@timestamp":"…","message":"Product 2 is out of stock …","level":"WARN","traceId":"6ac4…","spanId":"1a4b…","service":"order-service"}
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
  level:
    com.ecommerce: INFO
    org.springframework.kafka: INFO

# --- kafka (B) ---
spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Lets a listener continue the traceparent the publisher put on the record, so one traceId
    # spans HTTP and Kafka (NFR-06).
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

---
# Separate YAML document: B and C both define "management:", one document would duplicate the key
# --- management/metrics (C) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
