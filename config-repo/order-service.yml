# Each block is its own YAML document (---): write only inside your own block (docs/TEAM-GUIDE.md §1.2).

# --- order (B) ---
server:
  port: 8082

spring:
  datasource:
    # Containers and pods override these with SPRING_DATASOURCE_* (one login per service database, NFR-04)
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/order_db
    username: order_user
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cloud:
    openfeign:
      client:
        config:
          inventory-service:
            connect-timeout: 1000
            read-timeout: 2000

order:
  outbox:
    poll-interval-ms: 500
  kafka:
    topics:
      order-events: order-events
      inventory-events: inventory-events
      payment-events: payment-events
  # FR-14: the stock check authenticates with order-service's own client-credentials token
  service-auth:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ecommerce-platform/protocol/openid-connect/token}
    client-id: order-service
    client-secret: ${ORDER_SERVICE_CLIENT_SECRET}

# Resilience4j on Order -> Inventory: Retry(CircuitBreaker(TimeLimiter(Bulkhead(call))))
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  retry:
    instances:
      inventoryService:
        maxAttempts: 2
        waitDuration: 500ms
  timelimiter:
    instances:
      inventoryService:
        timeoutDuration: 2s
  bulkhead:
    instances:
      inventoryService:
        maxConcurrentCalls: 20
        maxWaitDuration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

---
