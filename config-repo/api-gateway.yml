server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          # Role rules per path live in SecurityConfig. /api/v1/inventory/check is denied there (internal only).
          routes:
            # B1: listed before product-service, so /products/{id}/reviews reaches review-service
            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/v1/products/*/reviews,/api/v1/products/*/reviews/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                    redis-rate-limiter.requestedTokens: 1
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**
              filters:
                # FR-13: public routes are rate limited per client (user id, else client IP)
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                    redis-rate-limiter.requestedTokens: 1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            - id: order-analytics
              uri: lb://order-service
              predicates:
                - Path=/api/v1/analytics/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
            # B4: Server-Sent Events stream of low-stock alerts (ADMIN). Long-lived: no response timeout, no rate limit.
            - id: inventory-alerts
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/alerts/**
              metadata:
                response-timeout: -1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

# B3: tenants the gateway accepts; anonymous catalogue reads without X-Tenant-Id use the default.
gateway:
  tenants:
    allowed: tenant-a,tenant-b
    default: tenant-a
